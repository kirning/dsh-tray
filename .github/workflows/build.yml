name: build

on:
  push:
    branches: [main, wails-v2]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: dsh-tray.exe
            built: bin/dsh-tray.exe
          - os: ubuntu-latest
            asset: dsh-tray-linux-amd64
            built: bin/dsh-tray
    runs-on: ${{ matrix.os }}
    env:
      # Linux 侧 Wails 必须用 cgo 链接 GTK/WebKit，否则会报
      # undefined: requires_CGO_ENABLED_1_or_build_tag_purego；
      # Windows 侧用纯 Go 后端即可，保持 0 更省事。
      CGO_ENABLED: ${{ runner.os == 'Windows' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Test core logic
        run: go test ./internal/...

      - name: Build
        run: wails3 build

      - name: Rename artifact
        shell: bash
        run: cp "${{ matrix.built }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dsh-tray.exe
            dist/dsh-tray-linux-amd64
          generate_release_notes: true
          fail_on_unmatched_files: true
